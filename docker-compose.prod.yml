# Sextante PRODUCTION orchestration (self-hosted).
#
# Differences from docker-compose.yml (which is for DEVELOPMENT):
#   - Adds the `web` service (dockerised Next, standalone output).
#   - Does NOT publish postgres or api to the host: they only talk over Compose's
#     internal network. The ONLY published port is the `web` one (WEB_PORT), so the
#     reverse proxy (TLS with Let's Encrypt) can reach it.
#   - Expects NODE_ENV=production and strong secrets (no insecure defaults).
#
# Good neighbour on a machine shared with other stacks:
#   - `name: sextante` namespaces the project, network and containers and avoids collisions.
#   - Its own named volume (sextante_pgdata). Internal ports, not host ones.
#
# Usage (run by the GitHub Actions runner; see .github/workflows/deploy.yml):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Secrets arrive via the .env that the workflow materialises from GitHub
# Secrets. Expected variables: see docs/DEPLOY.md §2.

name: sextante

# API image, shared by `migrate` and `api` (same Dockerfile, same tag): defined
# once and referenced by each service with `<<: *api-image`.
x-api-image: &api-image
  image: sextante-api:latest
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sextante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env}
      POSTGRES_DB: ${POSTGRES_DB:-sextante}
    volumes:
      - sextante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sextante} -d ${POSTGRES_DB:-sextante}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: applies the migrations and exits. The API waits for it to finish OK.
  migrate:
    <<: *api-image
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sextante}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sextante}
      # In production the API refuses to start if JWT_SECRET is missing or is the dev one.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the .env (openssl rand -base64 48)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:?set APP_URL (https://sextante.fpardo.net)}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in the .env}
      # No default sender: the sending domain belongs to each deployment, so it is
      # required explicitly instead of inheriting the original project's.
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM (sender verified in Resend)}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      PRICE_REFRESH_CRON: ${PRICE_REFRESH_CRON:-}
      # Intraday price refresh (hourly Mon-Fri by default); "off" disables it.
      PRICE_INTRADAY_CRON: ${PRICE_INTRADAY_CRON:-}
      # Trusted proxy hops to get the real client IP (rate limiting). See
      # apps/api/.env.example: 1 by default; raise it if there is more than one proxy in
      # front and the rate limit lumps every user into the same bucket.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      # Periodic pruning: expired OAuth codes and tokens, used login tokens, the MCP
      # audit log and abandoned DCR clients.
      OAUTH_REAPER_CRON: ${OAUTH_REAPER_CRON:-}
      LOGIN_TOKEN_RETENTION_DAYS: ${LOGIN_TOKEN_RETENTION_DAYS:-}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-}
      OAUTH_CLIENT_RETENTION_DAYS: ${OAUTH_CLIENT_RETENTION_DAYS:-}
      # Stripe SECRET key (donations). Empty → donations disabled.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: sextante-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked in at build time (the /api rewrite is frozen into the manifest). On the
        # Compose network the web service reaches the API by its service name.
        API_URL: http://api:3001
        # Canonical site URL: baked in at build time (SEO, sitemap, robots.txt).
        # Required: if missing, the build fails instead of falling back to
        # http://localhost:3000 (which would make the sitemap useless to Google).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL (https://sextante.fpardo.net)}
        # Public donations switch ("1" = show). Inlined at build time.
        NEXT_PUBLIC_DONATIONS_ENABLED: ${NEXT_PUBLIC_DONATIONS_ENABLED:-}
        # Self-hosted analytics: the web service proxies /stats/* to the `analytics` service
        # over the internal network (baked in at build time, like API_URL). Without a site ID
        # (empty until the site is created in the Umami dashboard) the script is not emitted.
        ANALYTICS_URL: http://analytics:3000
        NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${NEXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Same-origin via the internal network: the web service (BFF) proxies /api to the api service.
      API_URL: http://api:3001
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
    ports:
      # CAUTION: without an interface prefix, Docker publishes on 0.0.0.0 (the whole local
      # network), not just on loopback. This is deliberate: a reverse proxy running IN A
      # CONTAINER cannot reach the host's loopback, so it needs IP:port.
      # The proxy is the public entry point and terminates TLS.
      # If your proxy runs on the host, or you attach it to the `sextante` network and proxy
      # to http://web:3000, change this to '127.0.0.1:${WEB_PORT:-8790}:3000'.
      - '${WEB_PORT:-8790}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Encrypted backups: pg_dump -> gzip -> gpg (AES256) -> rclone (Google Drive).
  # Self-hosted analytics (Umami): cookieless, no third parties. A database SEPARATE from
  # Sextante's: that way neither the GDPR export/deletion nor the app backups mix it with
  # user data, and losing it compromises nothing (it holds aggregated metrics).
  analytics-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in the .env}
      POSTGRES_DB: umami
    volumes:
      - sextante_analytics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics:
    # Pinned version: the tracker and the send route (/api/send) are part of the
    # contract with next.config's rewrites; a version bump gets tested first.
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in the .env}@analytics-db:5432/umami
      APP_SECRET: ${ANALYTICS_APP_SECRET:?set ANALYTICS_APP_SECRET in the .env (openssl rand -base64 48)}
      # Do not check for new versions or send telemetry to umami.is.
      DISABLE_UPDATES: '1'
      DISABLE_TELEMETRY: '1'
      # The code that groups a person's visits rotates every DAY (monthly by default):
      # nobody can be tracked across days. It costs accuracy in monthly "unique
      # visitors"; the privacy policy promises exactly that.
      SALT_ROTATION: day
    ports:
      # The DASHBOARD is only published on the local network (and Tailscale), never through
      # the public proxy: from outside only /stats/script.js and /stats/api/send exist, which
      # the web service forwards over the internal network. Same reason as WEB_PORT for not
      # binding it to loopback (see the comment on the `web` service).
      - '${ANALYTICS_PORT:-8791}:3000'
    depends_on:
      analytics-db:
        condition: service_healthy

  # Takes a backup on start and then a daily one (cron). Encryption happens BEFORE
  # the data leaves the server. See scripts/backup/ and docs/DEPLOY.md.
  backup:
    image: sextante-backup:latest
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-sextante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sextante}
      BACKUP_GPG_PASSPHRASE: ${BACKUP_GPG_PASSPHRASE:?set BACKUP_GPG_PASSPHRASE in the .env}
      RCLONE_CONF_BASE64: ${RCLONE_CONF_BASE64:?set RCLONE_CONF_BASE64 in the .env}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive:sextante-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 4 * * *}
      TZ: Europe/Madrid
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sextante_pgdata:
    name: sextante_pgdata
  sextante_analytics_pgdata:
    name: sextante_analytics_pgdata
