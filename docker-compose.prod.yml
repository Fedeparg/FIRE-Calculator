# Orquestación de PRODUCCIÓN de Sextante (self-hosted).
#
# Diferencias con docker-compose.yml (que es de DESARROLLO):
#   - Añade el servicio `web` (Next dockerizado, salida standalone).
#   - NO publica postgres ni api al host: solo se hablan por la red interna de
#     Compose. El ÚNICO puerto publicado es el del `web` (WEB_PORT), para que el
#     proxy inverso (TLS con Let's Encrypt) lo alcance.
#   - Espera NODE_ENV=production y secretos fuertes (sin defaults inseguros).
#
# Buen vecino en una máquina compartida con otros stacks:
#   - `name: sextante` namespaca proyecto, red, contenedores y evita colisiones.
#   - Volumen nombrado propio (sextante_pgdata). Puertos internos, no del host.
#
# Uso (lo ejecuta el runner de GitHub Actions; ver .github/workflows/deploy.yml):
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Los secretos llegan vía el .env que el workflow materializa desde GitHub
# Secrets. Variables esperadas: ver docs/DEPLOY.md §2.

name: sextante

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sextante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:-sextante}
    volumes:
      - sextante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sextante} -d ${POSTGRES_DB:-sextante}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: aplica migraciones y termina. La API espera a que acabe OK.
  migrate:
    image: sextante-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sextante}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: sextante-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sextante}
      # En producción la API se niega a arrancar si JWT_SECRET falta o es el de dev.
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en el .env (openssl rand -base64 48)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:?define APP_URL (https://sextante.fpardo.net)}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:?define RESEND_API_KEY en el .env}
      # Sin remitente por defecto: el dominio de envío es propio de cada despliegue,
      # así que se exige explícitamente en vez de heredar el del proyecto original.
      EMAIL_FROM: ${EMAIL_FROM:?define EMAIL_FROM (remitente verificado en Resend)}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      PRICE_REFRESH_CRON: ${PRICE_REFRESH_CRON:-}
      # Refresco intradía de precios (por defecto cada hora L-V); "off" lo desactiva.
      PRICE_INTRADAY_CRON: ${PRICE_INTRADAY_CRON:-}
      # Saltos de proxy de confianza para obtener la IP real (rate limiting). Ver
      # apps/api/.env.example: por defecto 1; súbelo si hay más de un proxy delante
      # y el rate limit agrupa a todos los usuarios en el mismo cubo.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      # Poda periódica: códigos y tokens OAuth caducados, tokens de login gastados,
      # auditoría de MCP y clientes DCR abandonados.
      OAUTH_REAPER_CRON: ${OAUTH_REAPER_CRON:-}
      LOGIN_TOKEN_RETENTION_DAYS: ${LOGIN_TOKEN_RETENTION_DAYS:-}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-}
      OAUTH_CLIENT_RETENTION_DAYS: ${OAUTH_CLIENT_RETENTION_DAYS:-}
      # Clave SECRETA de Stripe (donaciones). Vacía → donaciones desactivadas.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: sextante-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Se hornea en build (el rewrite /api se congela en el manifiesto). En la
        # red de Compose el web alcanza la API por el nombre de servicio.
        API_URL: http://api:3001
        # URL canónica del sitio: se hornea en build (SEO, sitemap, robots.txt).
        # Obligatoria: si falta, el build falla en vez de caer al fallback
        # http://localhost:3000 (que dejaría el sitemap inservible para Google).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?define NEXT_PUBLIC_SITE_URL (https://sextante.fpardo.net)}
        # Interruptor público de donaciones ("1" = mostrar). Se inlinea en build.
        NEXT_PUBLIC_DONATIONS_ENABLED: ${NEXT_PUBLIC_DONATIONS_ENABLED:-}
        # Analítica propia: el web proxea /stats/* al servicio `analytics` por la red
        # interna (se hornea en build, como API_URL). Sin ID de sitio (vacío hasta crear
        # el sitio en el panel de Umami) no se emite el script.
        ANALYTICS_URL: http://analytics:3000
        NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${NEXT_PUBLIC_ANALYTICS_WEBSITE_ID:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Same-origin vía la red interna: el web (BFF) proxea /api al servicio api.
      API_URL: http://api:3001
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
    ports:
      # OJO: sin prefijo de interfaz, Docker publica en 0.0.0.0 (toda la red local),
      # no solo en el loopback. Es deliberado: un proxy inverso que corre EN UN
      # CONTENEDOR no alcanza el loopback del host, así que necesita IP:puerto.
      # El proxy es la entrada pública y termina el TLS.
      # Si tu proxy corre en el host, o lo conectas a la red `sextante` y proxeas a
      # http://web:3000, cambia esto a '127.0.0.1:${WEB_PORT:-8790}:3000'.
      - '${WEB_PORT:-8790}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backups cifrados: pg_dump -> gzip -> gpg (AES256) -> rclone (Google Drive).
  # Analítica propia (Umami): sin cookies, sin terceros. Base de datos APARTE de la de
  # Sextante: así ni el export/borrado RGPD ni los backups de la app la mezclan con
  # datos de usuarios, y perderla no compromete nada (son métricas agregadas).
  analytics-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?define ANALYTICS_DB_PASSWORD en el .env}
      POSTGRES_DB: umami
    volumes:
      - sextante_analytics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics:
    # Versión fijada: el tracker y la ruta de envío (/api/send) forman parte del
    # contrato con los rewrites de next.config; un salto de versión se prueba antes.
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql://umami:${ANALYTICS_DB_PASSWORD:?define ANALYTICS_DB_PASSWORD en el .env}@analytics-db:5432/umami
      APP_SECRET: ${ANALYTICS_APP_SECRET:?define ANALYTICS_APP_SECRET en el .env (openssl rand -base64 48)}
      # No avisar de versiones nuevas ni mandar telemetría a umami.is.
      DISABLE_UPDATES: '1'
      DISABLE_TELEMETRY: '1'
      # El código que agrupa las visitas de una persona cambia cada DÍA (por defecto,
      # cada mes): no se puede seguir a nadie entre días. Cuesta precisión en
      # "visitantes únicos" mensuales; la política de privacidad lo promete así.
      SALT_ROTATION: day
    ports:
      # El PANEL solo se publica en la red local (y Tailscale), nunca por el proxy
      # público: desde fuera solo existen /stats/script.js y /stats/api/send, que el
      # web reenvía por la red interna. Mismo motivo que WEB_PORT para no ligarlo al
      # loopback (ver el comentario del servicio `web`).
      - '${ANALYTICS_PORT:-8791}:3000'
    depends_on:
      analytics-db:
        condition: service_healthy

  # Hace un backup al arrancar y luego uno diario (cron). El cifrado ocurre ANTES
  # de salir del servidor. Ver scripts/backup/ y docs/DEPLOY.md.
  backup:
    image: sextante-backup:latest
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-sextante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sextante}
      BACKUP_GPG_PASSPHRASE: ${BACKUP_GPG_PASSPHRASE:?define BACKUP_GPG_PASSPHRASE en el .env}
      RCLONE_CONF_BASE64: ${RCLONE_CONF_BASE64:?define RCLONE_CONF_BASE64 en el .env}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive:sextante-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_CRON: ${BACKUP_CRON:-0 4 * * *}
      TZ: Europe/Madrid
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sextante_pgdata:
    name: sextante_pgdata
  sextante_analytics_pgdata:
    name: sextante_analytics_pgdata
