# Ejemplo de virtual host nginx para Sextante.
#
# ⚠️ Esto es una PLANTILLA, no un fichero listo para usar: sustituye <TU-DOMINIO>
# y <WEB_PORT> por tus valores antes de cargarlo. Tal cual, nginx dará error de
# sintaxis (los marcadores `<...>` no son válidos en la configuración).
#
# El stack de Docker publica el frontend en el puerto WEB_PORT del host (ver
# docker-compose.prod.yml). nginx es el único punto de entrada público y termina
# el TLS. El web (Next) hace de BFF y proxea /api al servicio api por la red
# interna de Compose, así que aquí NO hay que enrutar /api por separado.
#
# Pasos:
#   1) Copia/adapta este bloque a tu nginx (Nginx Proxy Manager o nginx clásico).
#   2) Sustituye <TU-DOMINIO> y <WEB_PORT> por tus valores.
#   3) Apunta el DNS de <TU-DOMINIO> a la IP del servidor.
#   4) Emite el certificado:  certbot --nginx -d <TU-DOMINIO>
#      (certbot reescribe este server{} para añadir el listen 443 + redirección).

server {
    listen 80;
    listen [::]:80;
    server_name <TU-DOMINIO>;

    # Tamaño de subida razonable (la app no sube ficheros grandes).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:<WEB_PORT>;
        proxy_http_version 1.1;

        # Cabeceras necesarias para que el `trust proxy` de la API obtenga la IP
        # real y el esquema correcto (cookies Secure, rate-limit por IP).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Soporte de WebSocket/streaming por si Next lo usa.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
