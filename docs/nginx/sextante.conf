# Example nginx virtual host for Sextante.
#
# ⚠️ This is a TEMPLATE, not a ready-to-use file: replace <YOUR-DOMAIN> and
# <WEB_PORT> with your values before loading it. As is, nginx will report a syntax
# error (the `<...>` placeholders are not valid configuration).
#
# The Docker stack publishes the frontend on the host's WEB_PORT (see
# docker-compose.prod.yml). nginx is the only public entry point and terminates
# TLS. The web service (Next) acts as the BFF and proxies /api to the api service
# over Compose's internal network, so /api does NOT need separate routing here.
#
# Steps:
#   1) Copy/adapt this block to your nginx (Nginx Proxy Manager or classic nginx).
#   2) Replace <YOUR-DOMAIN> and <WEB_PORT> with your values.
#   3) Point the DNS for <YOUR-DOMAIN> at the server's IP.
#   4) Issue the certificate:  certbot --nginx -d <YOUR-DOMAIN>
#      (certbot rewrites this server{} to add listen 443 + the redirect).

server {
    listen 80;
    listen [::]:80;
    server_name <YOUR-DOMAIN>;

    # Reasonable upload size (the app does not upload large files).
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:<WEB_PORT>;
        proxy_http_version 1.1;

        # Headers the API's `trust proxy` needs to get the real IP and the correct
        # scheme (Secure cookies, per-IP rate limiting).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket/streaming support in case Next uses it.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
