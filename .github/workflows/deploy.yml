# Continuous deployment to production (self-hosted runner).
#
# Triggered when the `ci` workflow COMPLETES SUCCESSFULLY on `main`, not on the
# direct push. It used to hang off `push: [main]` and ran IN PARALLEL with `ci`, so a
# commit that broke typecheck/lint/tests/build still reached production: the quality
# gate existed but did not govern the deployment. With `workflow_run` the order is
# real (ci → deploy) and only a green commit gets deployed.
#
# Three details make the gate impossible to skip:
#   1. Both `conclusion == 'success'` AND `head_branch == 'main'` are required. Without
#      the latter, a green CI on a PR branch would trigger a production deployment.
#   2. The checkout uses the CI run's `head_sha`, not the branch tip: if new commits
#      landed while CI was running, EXACTLY what was validated gets deployed.
#   3. `workflow_dispatch` is kept as a manual escape hatch (redeploy without touching
#      code, deploy if the gate gets stuck, or go back to a given commit with `ref`).
#
# Deployment safety:
#   - The job only succeeds once `api` and `web` report healthy (a crash loop fails it).
#   - Each deployed image is tagged with its SHA, and the one it replaces is kept as
#     `:previous`. Rollback without rebuilding: retag `:previous` as `:latest` and run
#     `docker compose -f docker-compose.prod.yml --env-file .env up -d --no-build`, or
#     run this workflow by hand with `ref` set to the commit to go back to.
#   - If the commit brings new migrations, a `pg_dump` is taken before applying them, in
#     the runner's persistent directory (host: /mnt/user/web/runner-sextante/predeploy).
#
# The runner must have the `sextante` label (see docs/DEPLOY.md) so it does not
# collide with other runners that only have `self-hosted`.
#
# ⚠️ SECURITY: if this repository is public, a self-hosted runner is dangerous.
# On a `pull_request` event GitHub runs the workflows FROM THE PR BRANCH, so
# anyone can open a PR from a fork with their own workflow requesting
# `runs-on: [self-hosted, sextante]` and run code on the server. Read the warning
# at the top of docs/DEPLOY.md before making the repository public.
#
# Secrets are injected from GitHub Secrets, materialised into an ephemeral .env
# (mode 600) and deleted at the end. They stay out of the repo and the logs.

name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch: # allows triggering it by hand from the Actions tab
    inputs:
      ref:
        description: SHA, branch or tag to deploy (empty = the branch selected above)
        required: false
        default: ''

concurrency:
  # One deployment at a time; never cancel one halfway.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Three conditions, all required:
    #
    # - `github.repository`: this repo is mirrored to a PUBLIC mirror
    #   (Fedeparg/sextante) that exists only as a showcase and has NO runner of its own.
    #   Without this guard, the job there would request a nonexistent
    #   `[self-hosted, sextante]` runner and stay queued forever. CAUTION: this is NOT a
    #   security control (a PR from a fork can bring its own workflow without this `if`);
    #   what makes the public copy safe is that it has no registered runner.
    # - `workflow_dispatch`: a manual trigger is accepted with no further checks (only
    #   someone with write access to the repo can launch it).
    # - `workflow_run`: only if CI ended green AND it was the `main` branch.
    if: >-
      github.repository == 'Fedeparg/FIRE-Calculator' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    # BOTH labels: only matches the Sextante runner, not other runners.
    runs-on: [self-hosted, sextante]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The EXACT commit CI validated. On `workflow_run` the default checkout would
          # take the branch tip, which may already be a later, unvalidated commit.
          # By hand, the given `ref` (e.g. the SHA to roll back to).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.ref }}
          # Full history: needed to tell whether there are new migrations since the deployed
          # commit (step "Back up the database before migrating").
          fetch-depth: 0

      - name: Materialise the production .env (ephemeral)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
          # Stripe SECRET key (donations): goes through Secrets, consumed by `api`.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Public donations switch (a Variable, not a Secret): "1" = show.
          NEXT_PUBLIC_DONATIONS_ENABLED: ${{ vars.NEXT_PUBLIC_DONATIONS_ENABLED }}
          # Self-hosted analytics (Umami): its Postgres and the dashboard secret. The site
          # ID is public (a Variable): empty until the site is created in the dashboard.
          ANALYTICS_DB_PASSWORD: ${{ secrets.ANALYTICS_DB_PASSWORD }}
          ANALYTICS_APP_SECRET: ${{ secrets.ANALYTICS_APP_SECRET }}
          NEXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_ANALYTICS_WEBSITE_ID }}
        run: |
          umask 077
          # The heredoc is unquoted so the values expand: never use backticks or `$(` in
          # its comment lines, or bash runs them as commands.
          # Heredoc WITHOUT -x: values are expanded from the step's environment
          # (not interpolated into the command line, so they do not end up in the logs).
          cat > .env <<EOF
          NODE_ENV=production
          APP_URL=https://sextante.fpardo.net
          # Canonical public URL: baked in by the web build (SEO, sitemap, robots).
          NEXT_PUBLIC_SITE_URL=https://sextante.fpardo.net
          COOKIE_SECURE=true
          EMAIL_TRANSPORT=resend
          EMAIL_FROM=Sextante <no-reply@send.fpardo.net>
          WEB_PORT=8790
          RCLONE_REMOTE=gdrive:sextante-backups
          BACKUP_RETENTION_DAYS=7
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          RESEND_API_KEY=${RESEND_API_KEY}
          OPENFIGI_API_KEY=${OPENFIGI_API_KEY}
          REVALIDATE_TOKEN=${REVALIDATE_TOKEN}
          BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE}
          RCLONE_CONF_BASE64=${RCLONE_CONF_BASE64}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          NEXT_PUBLIC_DONATIONS_ENABLED=${NEXT_PUBLIC_DONATIONS_ENABLED}
          ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD}
          ANALYTICS_APP_SECRET=${ANALYTICS_APP_SECRET}
          NEXT_PUBLIC_ANALYTICS_WEBSITE_ID=${NEXT_PUBLIC_ANALYTICS_WEBSITE_ID}
          EOF

      - name: Keep the previous images
        run: |
          for image in sextante-api sextante-web; do
            if docker image inspect "$image:latest" >/dev/null 2>&1; then
              docker image tag "$image:latest" "$image:previous"
            fi
          done

      # If the commit brings migrations compared with the deployed one (the SHA the running
      # image was tagged with), take a quick database dump before `migrate` applies them.
      # With no known SHA (the first deployment with this step) it always runs. The runner
      # container is ephemeral: only /tmp/github-runner survives (it is a host mount).
      # The last 5 dumps are kept.
      - name: Back up the database before migrating
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          deployed="$(docker images sextante-api --format '{{.Tag}}' | grep -E '^[0-9a-f]{40}$' | head -n 1 || true)"
          if [ -n "$deployed" ] && git cat-file -e "$deployed^{commit}" 2>/dev/null \
            && git diff --quiet "$deployed" "$current" -- apps/api/drizzle; then
            echo "No new migrations since $deployed: no dump needed."
            exit 0
          fi
          if ! docker compose -f docker-compose.prod.yml --env-file .env ps --status running postgres | grep -q postgres; then
            echo "Postgres is not running (first deployment): nothing to dump."
            exit 0
          fi
          # The dump holds personal data: readable by root only.
          umask 077
          dir=/tmp/github-runner/predeploy
          mkdir -p "$dir"
          docker compose -f docker-compose.prod.yml --env-file .env exec -T postgres \
            sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$dir/pre-migrate-$current.dump"
          ls -1t "$dir"/pre-migrate-*.dump | tail -n +6 | xargs -r rm -f
          echo "Dump at $dir/pre-migrate-$current.dump ($(du -h "$dir/pre-migrate-$current.dump" | cut -f1))"

      - name: Build and start the stack
        run: >-
          docker compose -f docker-compose.prod.yml --env-file .env
          up -d --build --remove-orphans

      # `up -d` returns as soon as the containers start: without this step a deployment whose
      # API crash-loops would end green. Polls the Docker healthchecks (not `up --wait`, which
      # also waits on the one-shot `migrate` service).
      - name: Wait for api and web to be healthy
        run: |
          set -euo pipefail
          for service in api web; do
            id="$(docker compose -f docker-compose.prod.yml --env-file .env ps -q "$service")"
            status=unknown
            for _ in $(seq 1 36); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$id")"
              [ "$status" = healthy ] && break
              sleep 5
            done
            echo "$service: $status"
            if [ "$status" != healthy ]; then
              docker compose -f docker-compose.prod.yml --env-file .env logs --tail 50 "$service"
              exit 1
            fi
          done

      - name: Tag the images with the deployed SHA
        run: |
          sha="$(git rev-parse HEAD)"
          for image in sextante-api sextante-web; do
            docker image tag "$image:latest" "$image:$sha"
            # Only the current SHA tag: the image it replaced stays as `:previous`.
            docker images "$image" --format '{{.Tag}}' | grep -E '^[0-9a-f]{40}$' | grep -v "^$sha$" \
              | xargs -r -I{} docker image rm "$image:{}"
          done

      # `if: always()`: also after a failed deployment, or the cache grows without bound.
      - name: Prune dangling images
        if: always()
        run: docker image prune -f

      # `up --build` leaves each deployment's layers in the BuildKit cache (~4 GB with
      # node_modules and the Next build), and `image prune` does not touch it: without this
      # it grew unbounded on the NAS disk. The most recently used entries are kept up to the
      # cap, so the next build keeps reusing the dependency layers.
      - name: Cap the build cache
        if: always()
        run: docker builder prune -f --max-used-space 8GB

      - name: Delete the ephemeral .env
        if: always()
        run: rm -f .env
