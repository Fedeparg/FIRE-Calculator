# Despliegue continuo a producción (UNRAID, runner self-hosted).
#
# Se dispara en cada push a `main`. Corre en TU runner de UNRAID (no en los
# runners de GitHub) porque necesita el daemon Docker del servidor para levantar
# el stack. El runner debe tener el label `sextante` (ver docs/DEPLOY.md) para
# NO colisionar con el runner de fpardo-web (que solo tiene `self-hosted`).
#
# Los secretos se inyectan desde GitHub Secrets, se materializan en un .env
# efímero (permisos 600) y se borran al terminar. No quedan en el repo ni en logs.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  # Un despliegue a la vez; no cancelar uno a medias.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # AMBOS labels: solo casa con el runner de Sextante, no con el de fpardo-web.
    runs-on: [self-hosted, sextante]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materializar el .env de producción (efímero)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
          # IDs PÚBLICOS de AdSense (no secretos): van por Variables, no Secrets.
          # Vacíos = sin anuncios. Se hornean en el build de `web` (NEXT_PUBLIC_*).
          NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}
        run: |
          umask 077
          # Heredoc SIN -x: los valores se expanden desde el entorno del step
          # (no se interpolan en la línea de comando, así no acaban en los logs).
          cat > .env <<EOF
          NODE_ENV=production
          APP_URL=https://sextante.fpardo.net
          COOKIE_SECURE=true
          EMAIL_TRANSPORT=resend
          EMAIL_FROM=Sextante <no-reply@send.fpardo.net>
          WEB_PORT=8790
          RCLONE_REMOTE=gdrive:sextante-backups
          BACKUP_RETENTION_DAYS=7
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          RESEND_API_KEY=${RESEND_API_KEY}
          OPENFIGI_API_KEY=${OPENFIGI_API_KEY}
          REVALIDATE_TOKEN=${REVALIDATE_TOKEN}
          BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE}
          RCLONE_CONF_BASE64=${RCLONE_CONF_BASE64}
          NEXT_PUBLIC_ADSENSE_CLIENT_ID=${NEXT_PUBLIC_ADSENSE_CLIENT_ID}
          NEXT_PUBLIC_ADSENSE_SLOT=${NEXT_PUBLIC_ADSENSE_SLOT}
          EOF

      - name: Construir y levantar el stack
        run: >-
          docker compose -f docker-compose.prod.yml --env-file .env
          up -d --build --remove-orphans

      - name: Podar imágenes colgadas
        run: docker image prune -f

      - name: Borrar el .env efímero
        if: always()
        run: rm -f .env
