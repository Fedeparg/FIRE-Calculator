# Despliegue continuo a producción (runner self-hosted).
#
# Se dispara en cada push a `main`. Corre en el runner self-hosted (no en los
# runners de GitHub) porque necesita el daemon Docker del servidor para levantar
# el stack. El runner debe tener el label `sextante` (ver docs/DEPLOY.md) para no
# colisionar con otros runners que solo tengan `self-hosted`.
#
# ⚠️ SEGURIDAD: si este repositorio es público, un runner self-hosted es peligroso.
# En un evento `pull_request` GitHub ejecuta los workflows DE LA RAMA DEL PR, así
# que cualquiera puede abrir un PR desde un fork con un workflow propio que pida
# `runs-on: [self-hosted, sextante]` y ejecutar código en el servidor. Lee el aviso
# al principio de docs/DEPLOY.md antes de hacer público el repositorio.
#
# Los secretos se inyectan desde GitHub Secrets, se materializan en un .env
# efímero (permisos 600) y se borran al terminar. No quedan en el repo ni en logs.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  # Un despliegue a la vez; no cancelar uno a medias.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Este repo se replica a un espejo PÚBLICO (Fedeparg/sextante) que existe solo
    # como escaparate y NO tiene runner propio. Sin este guard, allí el job pediría
    # un runner `[self-hosted, sextante]` inexistente y se quedaría encolado para
    # siempre. Con él, se salta limpiamente.
    #
    # OJO: esto NO es un control de seguridad. Un PR desde un fork puede traer su
    # propio workflow sin este `if`. Lo que hace segura la copia pública es que no
    # tiene ningún runner self-hosted registrado.
    if: github.repository == 'Fedeparg/FIRE-Calculator'
    # AMBOS labels: solo casa con el runner de Sextante, no con otros runners.
    runs-on: [self-hosted, sextante]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materializar el .env de producción (efímero)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
          # Clave SECRETA de Stripe (donaciones): va por Secrets, la consume el `api`.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          # Interruptor público de donaciones (Variable, no Secret): "1" = mostrar.
          NEXT_PUBLIC_DONATIONS_ENABLED: ${{ vars.NEXT_PUBLIC_DONATIONS_ENABLED }}
        run: |
          umask 077
          # Heredoc SIN -x: los valores se expanden desde el entorno del step
          # (no se interpolan en la línea de comando, así no acaban en los logs).
          cat > .env <<EOF
          NODE_ENV=production
          APP_URL=https://sextante.fpardo.net
          # URL canónica pública: la hornea el build de `web` (SEO, sitemap, robots).
          NEXT_PUBLIC_SITE_URL=https://sextante.fpardo.net
          COOKIE_SECURE=true
          EMAIL_TRANSPORT=resend
          EMAIL_FROM=Sextante <no-reply@send.fpardo.net>
          WEB_PORT=8790
          RCLONE_REMOTE=gdrive:sextante-backups
          BACKUP_RETENTION_DAYS=7
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          RESEND_API_KEY=${RESEND_API_KEY}
          OPENFIGI_API_KEY=${OPENFIGI_API_KEY}
          REVALIDATE_TOKEN=${REVALIDATE_TOKEN}
          BACKUP_GPG_PASSPHRASE=${BACKUP_GPG_PASSPHRASE}
          RCLONE_CONF_BASE64=${RCLONE_CONF_BASE64}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          NEXT_PUBLIC_DONATIONS_ENABLED=${NEXT_PUBLIC_DONATIONS_ENABLED}
          EOF

      - name: Construir y levantar el stack
        run: >-
          docker compose -f docker-compose.prod.yml --env-file .env
          up -d --build --remove-orphans

      - name: Podar imágenes colgadas
        run: docker image prune -f

      - name: Borrar el .env efímero
        if: always()
        run: rm -f .env
