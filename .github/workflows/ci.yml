# Integración continua: gate de calidad ANTES de fusionar/desplegar.
#
# Corre en cada push y pull request, en runners de GitHub (no en el self-hosted de
# producción): typecheck, lint, tests y build de los DOS paquetes (frontend y API).
# Los tests del backend levantan un PostgreSQL efímero con Testcontainers, que usa
# el Docker preinstalado en los runners `ubuntu-latest`.
#
# Para que sea un gate real, marca estos checks como obligatorios en la protección
# de la rama `main` (Settings → Branches → Branch protection), ya que eso es una
# configuración del repositorio y no puede vivir en este fichero.

name: ci

on:
  # Solo `main`: en una rama de PR, el evento `pull_request` ya cubre el gate.
  # Sin este filtro, cada push a una rama con PR abierto lanzaba CI DOS veces
  # (y el grupo de concurrencia difiere entre ambos eventos, así que ninguna
  # cancelaba a la otra).
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones antiguas de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Caché de compilación de Next: sin ella, cada build parte de cero. La clave
      # incluye el lockfile y las fuentes; si solo cambian las fuentes, `restore-keys`
      # recupera la caché del último lockfile igual y Next reaprovecha lo que no cambió.
      - name: Caché de Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'packages/core/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @sextante/api typecheck

      - name: Lint
        run: pnpm --filter @sextante/api lint

      - name: Tests (Postgres efímero vía Testcontainers)
        run: pnpm --filter @sextante/api test

      - name: Build
        run: pnpm --filter @sextante/api build
