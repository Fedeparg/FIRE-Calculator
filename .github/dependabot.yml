version: 2

updates:
  # Frontend (root of the pnpm workspace). `directory: /` also covers apps/api
  # because Dependabot resolves the workspace from the root pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Groups patch/minor updates into a single PR so the repo is not flooded.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly

  # The API image lives in its own directory, which `/` does not walk.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly

  # Service images (postgres, caddy…) in the Compose files.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
