# Orquestación de Sextante.
#
# PostgreSQL (volumen persistente) + servicio one-shot de migración + API NestJS.
# El frontend Next se ejecuta de momento con `pnpm dev` (HMR) y proxea /api a la
# API vía rewrites. El web dockerizado y el despliegue de producción (con un proxy
# inverso externo que termina el TLS) viven en docker-compose.prod.yml.
#
# Uso:
#   docker compose up -d --build   # migra y levanta postgres + api
#   docker compose logs -f api     # ver logs de la API
#   docker compose down            # parar (los datos persisten en el volumen)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sextante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sextante_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sextante}
    ports:
      # Expuesto SOLO en el loopback del host, para lanzar migraciones (drizzle-kit)
      # desde fuera del contenedor. Sin el prefijo 127.0.0.1, Docker publicaría el
      # puerto en TODAS las interfaces y la contraseña por defecto de desarrollo
      # (`sextante_dev`, pública en este fichero) dejaría Postgres abierto a la LAN.
      - '127.0.0.1:5432:5432'
    volumes:
      # Volumen NOMBRADO persistente: los datos sobreviven a `down`/recreaciones.
      - sextante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sextante} -d ${POSTGRES_DB:-sextante}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Servicio one-shot: aplica las migraciones y termina. La API espera a que acabe
  # OK, así un arranque limpio nunca queda con la BD sin esquema.
  migrate:
    image: sextante-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD:-sextante_dev}@postgres:5432/${POSTGRES_DB:-sextante}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: sextante-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      # Por defecto DEV (arranca out-of-the-box). En PRODUCCIÓN (UNRAID) definir vía
      # .env: NODE_ENV=production + JWT_SECRET fuerte + COOKIE_SECURE=true. Con
      # NODE_ENV=production, la API se NIEGA a arrancar con el JWT_SECRET por defecto.
      NODE_ENV: ${NODE_ENV:-development}
      # Dentro de la red de Compose, el host de la BD es el nombre del servicio.
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD:-sextante_dev}@postgres:5432/${POSTGRES_DB:-sextante}
      # Secreto del JWT de sesión (en prod, definir uno fuerte vía .env del compose).
      JWT_SECRET: ${JWT_SECRET:-dev_insecure_secret_change_me}
      # Cookie Secure: false en dev (http://localhost), true en prod (HTTPS).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # URL del frontend (base del magic link).
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Transporte de email: dev (log) o resend (producción).
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Resolución ISIN/ticker → símbolo (OpenFIGI) y cadencia del refresco de precios.
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      PRICE_REFRESH_CRON: ${PRICE_REFRESH_CRON:-}
      # Refresco intradía de precios (por defecto cada hora L-V); "off" lo desactiva.
      PRICE_INTRADAY_CRON: ${PRICE_INTRADAY_CRON:-}
      # Saltos de proxy de confianza para obtener la IP real (rate limiting). Ver
      # apps/api/.env.example: por defecto 1; súbelo si hay más de un proxy delante
      # y el rate limit agrupa a todos los usuarios en el mismo cubo.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      # Poda periódica: códigos y tokens OAuth caducados, tokens de login gastados,
      # auditoría de MCP y clientes DCR abandonados.
      OAUTH_REAPER_CRON: ${OAUTH_REAPER_CRON:-}
      LOGIN_TOKEN_RETENTION_DAYS: ${LOGIN_TOKEN_RETENTION_DAYS:-}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-}
      OAUTH_CLIENT_RETENTION_DAYS: ${OAUTH_CLIENT_RETENTION_DAYS:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Node 24 trae fetch global; sale 0 si /health responde OK.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sextante_pgdata:
    name: sextante_pgdata
