# Sextante orchestration.
#
# PostgreSQL (persistent volume) + one-shot migration service + NestJS API.
# The Next frontend runs with `pnpm dev` (HMR) for now and proxies /api to the
# API via rewrites. The dockerised web service and the production deployment (with
# an external reverse proxy that terminates TLS) live in docker-compose.prod.yml.
#
# Usage:
#   docker compose up -d --build   # migrate and start postgres + api
#   docker compose logs -f api     # follow the API logs
#   docker compose down            # stop (data persists in the volume)

# API image, shared by `migrate` and `api` (same Dockerfile, same tag): defined
# once and referenced by each service with `<<: *api-image`.
x-api-image: &api-image
  image: sextante-api:latest
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sextante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sextante_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sextante}
    ports:
      # Exposed ONLY on the host loopback, to run migrations (drizzle-kit) from
      # outside the container. Without the 127.0.0.1 prefix, Docker would publish the
      # port on ALL interfaces and the default dev password (`sextante_dev`, public
      # in this file) would leave Postgres open to the LAN.
      - '127.0.0.1:5432:5432'
    volumes:
      # Persistent NAMED volume: data survives `down`/recreations.
      - sextante_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sextante} -d ${POSTGRES_DB:-sextante}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot service: applies the migrations and exits. The API waits for it to
  # finish OK, so a clean start never ends up with a schema-less DB.
  migrate:
    <<: *api-image
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD:-sextante_dev}@postgres:5432/${POSTGRES_DB:-sextante}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    environment:
      PORT: 3001
      # DEV by default (works out of the box). In PRODUCTION (UNRAID) set via
      # .env: NODE_ENV=production + a strong JWT_SECRET + COOKIE_SECURE=true. With
      # NODE_ENV=production, the API REFUSES to start with the default JWT_SECRET.
      NODE_ENV: ${NODE_ENV:-development}
      # Inside the Compose network, the DB host is the service name.
      DATABASE_URL: postgres://${POSTGRES_USER:-sextante}:${POSTGRES_PASSWORD:-sextante_dev}@postgres:5432/${POSTGRES_DB:-sextante}
      # Session JWT secret (in prod, set a strong one via the compose .env).
      JWT_SECRET: ${JWT_SECRET:-dev_insecure_secret_change_me}
      # Secure cookie: false in dev (http://localhost), true in prod (HTTPS).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Frontend URL (base of the magic link).
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Email transport: dev (log) or resend (production).
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-dev}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # ISIN/ticker → symbol resolution (OpenFIGI) and price refresh schedule.
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
      PRICE_REFRESH_CRON: ${PRICE_REFRESH_CRON:-}
      # Intraday price refresh (hourly Mon-Fri by default); "off" disables it.
      PRICE_INTRADAY_CRON: ${PRICE_INTRADAY_CRON:-}
      # Trusted proxy hops to get the real client IP (rate limiting). See
      # apps/api/.env.example: 1 by default; raise it if there is more than one proxy in
      # front and the rate limit lumps every user into the same bucket.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      # Periodic pruning: expired OAuth codes and tokens, used login tokens, the MCP
      # audit log and abandoned DCR clients.
      OAUTH_REAPER_CRON: ${OAUTH_REAPER_CRON:-}
      LOGIN_TOKEN_RETENTION_DAYS: ${LOGIN_TOKEN_RETENTION_DAYS:-}
      MCP_AUDIT_RETENTION_DAYS: ${MCP_AUDIT_RETENTION_DAYS:-}
      OAUTH_CLIENT_RETENTION_DAYS: ${OAUTH_CLIENT_RETENTION_DAYS:-}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Node 24 ships a global fetch; exits 0 if /health responds OK.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  sextante_pgdata:
    name: sextante_pgdata
